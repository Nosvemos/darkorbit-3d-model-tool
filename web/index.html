<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarkOrbit 3D Tool</title>
<style>
  :root { --bg:#15171c; --panel:#1d2026; --panel2:#23272f; --line:#2e333d;
          --fg:#d6d9df; --mut:#8b909a; --acc:#ff7a18; --acc2:#39b0ff; --err:#ff4a4a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  header { padding:12px 18px; border-bottom:1px solid var(--line);
           font-weight:600; letter-spacing:.3px; }
  header span { color:var(--acc); }
  .wrap { display:flex; height:calc(100vh - 49px); }
  aside { width:280px; border-right:1px solid var(--line); display:flex;
          flex-direction:column; background:var(--panel); }
  .tabs { display:flex; }
  .tabs button { flex:1; background:none; border:none; color:var(--mut);
                 padding:10px 0; cursor:pointer; border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--fg); border-bottom-color:var(--acc); }
  #search { margin:8px; padding:7px 9px; background:var(--panel2);
            border:1px solid var(--line); color:var(--fg); border-radius:6px; }
  #list { overflow:auto; flex:1; }
  #list div { padding:6px 14px; cursor:pointer; color:var(--mut);
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #list div:hover { background:var(--panel2); }
  #list div.on { background:var(--panel2); color:var(--acc2);
                 border-left:3px solid var(--acc2); padding-left:11px; }
  main { flex:1; overflow:auto; padding:18px 22px; }
  h2 { margin:0 0 4px; }
  .mut { color:var(--mut); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:14px 16px; margin:14px 0; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px;
          color:var(--mut); }
  input, select { background:var(--panel2); border:1px solid var(--line);
                  color:var(--fg); border-radius:6px; padding:6px 8px; }
  input[type=number] { width:90px; }
  button.act { background:var(--acc); color:#160d04; border:none; font-weight:600;
               padding:8px 16px; border-radius:6px; cursor:pointer; }
  button.act.alt { background:var(--acc2); color:#04121c; }
  button.act:disabled { opacity:.5; cursor:default; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td,th { text-align:left; padding:3px 10px 3px 0; }
  th { color:var(--mut); font-weight:500; }
  .pt { color:var(--acc2); }
  #status { color:var(--mut); min-height:20px; }
  #stage { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  #viewer { background:#0d0f13 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="10" height="10" fill="%23191b20"/><rect x="10" y="10" width="10" height="10" fill="%23191b20"/></svg>');
            border:1px solid var(--line); border-radius:8px; width:340px; height:340px;
            display:flex; align-items:center; justify-content:center; }
  #viewer img { max-width:100%; max-height:100%; image-rendering:auto; }
  .links a { color:var(--acc2); margin-right:14px; }
  .pill { font-size:11px; background:var(--panel2); border:1px solid var(--line);
          padding:2px 8px; border-radius:20px; color:var(--mut); }
  header { background:linear-gradient(90deg,#1d2026,#15171c); }
  .card { box-shadow:0 1px 0 #00000022; }
  button.act:hover { filter:brightness(1.08); }
  details summary { cursor:pointer; color:var(--acc2); font-size:13px;
                    user-select:none; outline:none; }
  details[open] summary { margin-bottom:2px; }
  label.chk { flex-direction:row; align-items:center; gap:6px; color:var(--fg);
              font-size:13px; }
  input[type=range] { accent-color:var(--acc); }
  #list::-webkit-scrollbar, main::-webkit-scrollbar { width:9px; }
  #list::-webkit-scrollbar-thumb, main::-webkit-scrollbar-thumb {
    background:var(--line); border-radius:6px; }
  [hidden] { display:none !important; }
  #texture-picker { position:fixed; z-index:10000; overflow-y:auto; overflow-x:hidden;
                    overscroll-behavior:contain; scrollbar-width:thin;
                    scrollbar-color:#596170 #23272f; padding:4px;
                    color:var(--fg); background:var(--panel2);
                    border:1px solid #49505c; border-radius:7px;
                    box-shadow:0 8px 24px #0009; }
  #texture-picker::-webkit-scrollbar { width:10px; }
  #texture-picker::-webkit-scrollbar-track { background:#23272f; border-radius:6px; }
  #texture-picker::-webkit-scrollbar-thumb { background:#596170; border:2px solid #23272f;
                                              border-radius:7px; }
  #texture-picker [role=option] { display:block; width:100%; height:30px; padding:4px 8px;
                                  border:0; border-bottom:1px solid #303640;
                                  background:transparent; color:var(--fg); text-align:left;
                                  font:12px/21px ui-monospace,SFMono-Regular,Consolas,monospace;
                                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                                  cursor:pointer; }
  #texture-picker [role=option]:hover, #texture-picker [role=option][aria-selected=true] {
    background:#343b46; color:#fff; }
  #texture-picker .picker-message { padding:7px 9px; color:var(--mut); font-size:12px; }
  @media (max-width:760px) {
    .wrap { display:block; height:auto; min-height:calc(100vh - 49px); }
    aside { width:100%; height:220px; border-right:0; border-bottom:1px solid var(--line); }
    main { overflow:visible; padding:14px; }
    #viewer { width:min(340px,100%); height:auto; aspect-ratio:1; }
    input.tex { width:190px; max-width:100%; }
  }
</style>
</head>
<body>
<header>DarkOrbit <span>3D</span> Tool</header>
<div class="wrap">
  <aside>
    <div class="tabs">
      <button data-kind="meshes" class="on">Meshes</button>
      <button data-kind="fx">FX Meshes</button>
      <button data-kind="effects">Effects</button>
    </div>
    <input id="search" placeholder="filter…">
    <div id="list"></div>
  </aside>
  <main>
    <div id="empty" class="mut">Select an asset on the left.</div>
    <div id="detail" style="display:none">
      <h2 id="title"></h2>
      <div id="meta" class="mut"></div>

      <div class="card" id="info"></div>

      <div class="card" id="actions"></div>

      <div class="card">
        <div id="status">Ready.</div>
        <div id="stage" style="margin-top:12px">
          <div id="viewer"><span class="mut">no preview yet</span></div>
          <div>
            <div class="row" style="margin-bottom:8px">
              <button class="act alt" id="play">⏸ Pause</button>
              <label>Frame <input type="range" id="scrub" min="0" value="0"></label>
              <label>Speed <input type="range" id="speed" min="20" max="200" value="80"></label>
              <span id="fcount" class="pill"></span>
            </div>
            <div class="links" id="links"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="texture-picker" role="listbox" aria-label="ATF texture suggestions" hidden></div>
<script>
const $ = s => document.querySelector(s);
let kind = "meshes", sel = null, items = [];
let frames = [], fi = 0, timer = null;

const isFx = () => kind === "fx";
const isEffect = () => kind === "effects";

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error((await r.json()).error||r.status); return r.json(); }
async function jpost(u,b){ const r = await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); if(!r.ok) throw new Error((await r.json()).error||r.status); return r.json(); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
// start a background job, poll it, stream its latest log line into the status
async function runJob(endpoint, body, updateStatus){
  updateStatus = updateStatus || setStatus;
  const {job} = await jpost(endpoint, body);
  const t0 = Date.now();
  while(true){
    await sleep(700);
    const s = await jget("/api/job?id="+job);
    const secs = ((Date.now()-t0)/1000).toFixed(0);
    const last = s.log && s.log.length ? s.log[s.log.length-1] : "working";
    if(s.status==="queued") {
      const pos = s.queue_position ? ` #${s.queue_position}` : "";
      updateStatus(`queued${pos} (${secs}s)`.slice(0,90));
    }
    else if(s.status==="running") updateStatus(`(${secs}s) ${last}`.slice(0,90));
    else if(s.status==="done") return s.result;
    else throw new Error(s.error || s.status);
  }
}

async function loadList(){
  const d = await jget("/api/list?kind="+kind);
  items = d.items; renderList();
}
function renderList(){
  const f = $("#search").value.toLowerCase();
  const box = $("#list"); box.innerHTML = "";
  items.filter(n=>n.toLowerCase().includes(f)).forEach(n=>{
    const el = document.createElement("div");
    el.textContent = n; el.className = (n===sel?"on":"");
    el.onclick = ()=>select(n); box.appendChild(el);
  });
}
function setStatus(t){ $("#status").textContent = t; }

async function select(name){
  sel = name; renderList();
  $("#empty").style.display="none"; $("#detail").style.display="block";
  $("#title").textContent = name;
  $("#meta").textContent = kind==="meshes"?"mesh":kind==="fx"?"fx mesh":"particle effect";
  stopAnim(); frames=[]; $("#viewer").innerHTML='<span class="mut">no preview yet</span>';
  $("#links").innerHTML=""; $("#fcount").textContent="";
  renderActions();
  if(isEffect()){ $("#info").innerHTML='<span class="mut">Away3D particle effect — render to preview the sprite sequence.</span>'; return; }
  $("#info").innerHTML='<span class="mut">loading…</span>';
  try{
    const i = await jget(`/api/info?name=${encodeURIComponent(name)}&fx=${isFx()?1:0}`);
    let rows = i.objects.map(o=>`<tr><td><label class="chk" style="margin:0;font-size:13px;font-weight:normal;cursor:pointer;"><input type="checkbox" class="obj-visible" data-name="${o.name}" checked> ${o.name}${o.point?' <span class="pt">●point</span>':''}</label></td><td>${o.verts}v</td><td>${o.tris}t</td></tr>`).join("");
    const detected = Object.keys(i.textures||{});
    $("#info").innerHTML = `<table><tr><th>object</th><th>verts</th><th>tris</th></tr>${rows}</table>
      <div class="mut" style="margin-top:8px">auto textures: ${detected.join(", ")||"none"} · clips: ${i.clips.join(", ")||"none"}</div>`;
    // pre-fill the manual texture inputs with whatever was auto-detected
    Object.entries(i.textures||{}).forEach(([c,n])=>{
      const el = document.querySelector(`#actions .tex[data-ch="${c}"]`);
      if(el) { el.value = n; validateTextureInput(el); }
    });
    // populate the clip selector (vertex animations); "all" plays every clip
    const cl = $("#o_clip");
    if(cl) cl.innerHTML = '<option value="">all clips</option>' +
      (i.clips||[]).map(c=>`<option value="${c}">${c}</option>`).join("");
  }catch(e){ $("#info").innerHTML = `<span class="mut">info error: ${e.message}</span>`; }
}

const HDRIS = ["studio","city","courtyard","forest","interior","night","sunrise","sunset"];
const num = (k,v,step="",min=null,max=null) => `<label>${k.label}<input type="number" class="opt" data-key="${k.key}" value="${v}"${step?` step="${step}"`:""}${min!==null?` min="${min}"`:""}${max!==null?` max="${max}"`:""}></label>`;
const color = (k,v) => `<label>${k.label}<input type="color" class="opt" data-key="${k.key}" value="${v}"></label>`;

function saveSettings(){
  const saved = {};
  document.querySelectorAll("#actions .opt").forEach(el=>{
    saved[el.dataset.key] = el.value;
  });
  document.querySelectorAll("#actions .optbool").forEach(el=>{
    saved[el.dataset.key] = el.checked;
  });
  const gltfEl = $("#o_gltf");
  const objEl = $("#o_obj");
  if(gltfEl) saved["_gltf"] = gltfEl.checked;
  if(objEl) saved["_obj"] = objEl.checked;
  return saved;
}

function restoreSettings(saved){
  if(!saved) return;
  document.querySelectorAll("#actions .opt").forEach(el=>{
    const key = el.dataset.key;
    if (key in saved && key !== "output_name" && key !== "overlay" && key !== "crop_align") {
      el.value = saved[key];
    }
  });
  document.querySelectorAll("#actions .optbool").forEach(el=>{
    const key = el.dataset.key;
    if (key in saved) {
      el.checked = saved[key];
    }
  });
  const gltfEl = $("#o_gltf");
  const objEl = $("#o_obj");
  if(gltfEl && "_gltf" in saved) gltfEl.checked = saved["_gltf"];
  if(objEl && "_obj" in saved) objEl.checked = saved["_obj"];
}

function renderActions(){
  closeTexturePicker();
  const saved = saveSettings();
  const a = $("#actions");
  if(isEffect()){
    a.innerHTML = `<div class="row">
      <label>export name<input type="text" class="opt" data-key="output_name" placeholder="(same)"></label>
      ${num({label:"frames",key:"frames"},30,"1",1,600)}
      ${num({label:"resolution",key:"resolution"},256,"1",16,2048)}
      ${num({label:"margin",key:"margin"},1.2,"0.05",0.05,10)}
      <button class="act" id="b_fx">Render Effect</button></div>`;
    $("#b_fx").onclick = runFx;
    restoreSettings(saved);
    return;
  }
  a.innerHTML = `<div class="row">
      <label>profile<select class="opt" data-key="profile" id="o_profile"><option value="darkorbit" selected>darkorbit</option><option value="studio">studio</option></select></label>
      <label>mode<select class="opt" data-key="mode"><option>auto</option><option>ship</option><option>item</option></select></label>
      <label>quality<select class="opt" data-key="quality" id="o_quality">
        <option value="extra_low">extra low</option>
        <option value="low">low</option>
        <option value="medium" selected>medium</option>
        <option value="high">high</option>
        <option value="extra_high">extra high</option>
        <option value="custom">custom</option>
      </select></label>
      ${num({label:"frames",key:"frames"},72)}
      ${num({label:"resolution",key:"resolution"},256)}
      <label>lighting<select class="opt" data-key="world_hdri">${HDRIS.map(h=>`<option value="${h}.exr">${h}</option>`).join("")}</select></label>
      <label>clip<select id="o_clip"><option value="">all</option></select></label>
      <label>export name<input type="text" class="opt" id="o_output_name" data-key="output_name" placeholder="(same)" style="width:110px"></label>
      <label>overlay<input type="text" class="opt" id="o_overlay" data-key="overlay" placeholder="e.g. sibelonit" style="width:90px"></label>
      <label>crop align<input type="text" class="opt" id="o_crop_align" data-key="crop_align" placeholder="e.g. aegis_full" style="width:110px"></label>
      <button class="act" id="b_render">Render Sprites</button>
    </div>
    <div style="margin-top:12px">
      <div class="mut" style="font-size:12px;margin-bottom:6px">Textures (.atf — leave blank for auto)</div>
      <div class="row">
        ${["diffuse","normal","specular","glow","alpha","ao","gal"].map(c=>`<label>${c}<input class="tex" data-ch="${c}" placeholder="(auto)" autocomplete="off"></label>`).join("")}
      </div>
    </div>
    <details style="margin-top:10px">
      <summary>Advanced</summary>
      <div class="row" style="margin-top:10px">
        ${num({label:"elevation°",key:"cam_elevation"},55)}
        ${num({label:"azimuth°",key:"cam_azimuth"},-90)}
        ${num({label:"cam tilt°",key:"cam_tilt"},135)}
        ${num({label:"cam pan°",key:"cam_pan"},25)}
        ${num({label:"FOV°",key:"cam_fov"},30)}
        ${num({label:"cam dist",key:"cam_distance"},"")}
        ${num({label:"start angle°",key:"start_angle"},90)}
        ${num({label:"total°",key:"total_degrees"},360)}
        ${num({label:"margin",key:"cam_margin"},1.15,"0.05")}
        ${num({label:"samples",key:"samples"},96)}
        ${num({label:"emission",key:"emission_strength"},1,"0.1")}
        ${num({label:"anim start",key:"anim_frame_start"},1)}
        ${num({label:"anim end",key:"anim_frame_end"},"")}
        ${num({label:"world str",key:"world_strength"},0.5,"0.1")}
        ${num({label:"sun energy",key:"sun_energy"},0.8,"0.1")}
        ${num({label:"sun tilt°",key:"sun_tilt"},100)}
        ${num({label:"sun pan°",key:"sun_pan"},35)}
        ${color({label:"world color",key:"world_color"},"#ff855c")}
        ${color({label:"sun color",key:"sun_color"},"#a3ffff")}
        <label>camera<select class="opt" data-key="camera_model"><option value="darkorbit">darkorbit</option><option value="orbit">orbit</option></select></label>
        <label>light<select class="opt" data-key="light_model"><option value="darkorbit">darkorbit</option><option value="blender">blender</option></select></label>
        <label>light quality<select class="opt" data-key="light_quality"><option>medium</option><option>low</option><option>high</option></select></label>
        <label>view<select class="opt" data-key="view_transform"><option>Standard</option><option>AgX</option><option>Filmic</option></select></label>
        <label class="chk"><input type="checkbox" class="optbool" data-key="use_hdri" data-invert="1"> HDRI</label>
        <label class="chk"><input type="checkbox" class="optbool" data-key="hero_light" data-invert="1"> hero light</label>
        <label class="chk"><input type="checkbox" class="optbool" data-key="cam_ortho" data-invert="1"> orthographic</label>
        <label class="chk"><input type="checkbox" class="optbool" data-key="rotation" data-invert="1" checked> rotation</label>
      </div>
    </details>
    <div class="row" style="margin-top:12px">
      <label class="chk"><input type="checkbox" id="o_gltf"> .gltf</label>
      <label class="chk"><input type="checkbox" id="o_obj"> .obj</label>
      <button class="act alt" id="b_convert">Convert to glb</button>
    </div>`;

  const presets = {
    extra_low: {resolution: 128, samples: 16},
    low: {resolution: 256, samples: 32},
    medium: {resolution: 256, samples: 96},
    high: {resolution: 512, samples: 128},
    extra_high: {resolution: 1024, samples: 256}
  };
  $("#o_quality").onchange = (e) => {
    const val = e.target.value;
    if(val in presets) {
      document.querySelector('.opt[data-key="resolution"]').value = presets[val].resolution;
      document.querySelector('.opt[data-key="samples"]').value = presets[val].samples;
    }
  };
  const onManualChange = () => {
    $("#o_quality").value = "custom";
  };
  document.querySelector('.opt[data-key="resolution"]').oninput = onManualChange;
  document.querySelector('.opt[data-key="samples"]').oninput = onManualChange;

  const profiles = {
    darkorbit: {
      camera_model:"darkorbit", light_model:"darkorbit", use_hdri:false,
      world_strength:0.5, world_color:"#ff855c", sun_energy:0.8, sun_color:"#a3ffff",
      sun_tilt:100, sun_pan:35, emission_strength:1, cam_ortho:false,
      cam_fov:30, cam_tilt:135, cam_pan:25, cam_distance:"",
      light_quality:"medium", hero_light:false
    },
    studio: {
      camera_model:"orbit", light_model:"blender", use_hdri:true,
      world_strength:0.8, world_color:"#ffffff", sun_energy:1.5, sun_color:"#ffffff",
      sun_tilt:100, sun_pan:35, emission_strength:0.6, cam_ortho:true,
      cam_fov:35, cam_tilt:135, cam_pan:25, cam_distance:"",
      light_quality:"medium", hero_light:false
    }
  };
  $("#o_profile").onchange = (e) => {
    const p = profiles[e.target.value] || profiles.darkorbit;
    Object.entries(p).forEach(([key,val])=>{
      const el = document.querySelector(`#actions .opt[data-key="${key}"]`);
      if(el) el.value = val;
      const b = document.querySelector(`#actions .optbool[data-key="${key}"]`);
      if(b) b.checked = !!val;
    });
  };

  $("#b_render").onclick = runRender;
  $("#b_convert").onclick = runConvert;

  restoreSettings(saved);
}

// gather every .opt / .optbool input in the actions panel into an override dict
function collectOpts(){
  const o = {};
  document.querySelectorAll("#actions .opt").forEach(el=>{
    if(el.value==="") return;
    o[el.dataset.key] = el.type==="number" ? +el.value : el.value;
  });
  document.querySelectorAll("#actions .optbool").forEach(el=>{
    o[el.dataset.key] = el.dataset.invert ? el.checked : !el.checked;
  });
  return o;
}
// manual texture overrides: {channel: atf-name} for any filled .tex input
function collectTextures(){
  const t = {};
  document.querySelectorAll("#actions .tex").forEach(el=>{
    if(el.value.trim()) t[el.dataset.ch] = el.value.trim();
  });
  return t;
}

function collectHiddenObjects(){
  const hidden = [];
  document.querySelectorAll(".obj-visible").forEach(el=>{
    if(!el.checked) hidden.push(el.dataset.name);
  });
  return hidden;
}

function busy(b){ document.querySelectorAll("#actions button").forEach(x=>x.disabled=b); }
function sameSelection(s,k){ return sel===s && kind===k; }

async function runConvert(){
  const s = sel, k = kind;
  const status = t => { if(sameSelection(s,k)) setStatus(t); };
  busy(true); setStatus("converting… (Blender)");
  try{
    const r = await runJob("/api/convert",{
      name: s,
      fx: k==="fx",
      gltf: $("#o_gltf").checked,
      obj: $("#o_obj").checked,
      textures: collectTextures(),
      clip: ($("#o_clip")||{}).value||"",
      overlay: ($("#o_overlay")||{}).value||"",
      output_name: ($("#o_output_name")||{}).value||"",
      hide_objects: collectHiddenObjects()
    }, status);
    if(sameSelection(s,k)){ setStatus("converted ✓"); showLinks({glb:r.glb}); }
  }catch(e){ if(sameSelection(s,k)) setStatus("error: "+e.message); }
  finally{ if(sameSelection(s,k)) busy(false); }
}
async function runRender(){
  const s = sel, k = kind;
  const status = t => { if(sameSelection(s,k)) setStatus(t); };
  busy(true); setStatus("rendering sprites… (Blender)");
  try{
    const r = await runJob("/api/render", Object.assign({
      name: s,
      fx: k==="fx",
      textures: collectTextures(),
      clip: ($("#o_clip")||{}).value||"",
      hide_objects: collectHiddenObjects()
    }, collectOpts()), status);
    const fr = (r && r.frames) || [];
    if(sameSelection(s,k)){
      setStatus(`rendered ${fr.length} frames ✓`);
      playFrames(fr); showLinks(r || {});
    }
  }catch(e){ if(sameSelection(s,k)) setStatus("error: "+e.message); }
  finally{ if(sameSelection(s,k)) busy(false); }
}
async function runFx(){
  const s = sel, k = kind;
  const status = t => { if(sameSelection(s,k)) setStatus(t); };
  const invalid = [...document.querySelectorAll('#actions input[type="number"]')]
    .find(el=>!el.checkValidity());
  if(invalid){ invalid.reportValidity(); return; }
  busy(true); setStatus("simulating particles…");
  try{
    const r = await runJob("/api/fx", Object.assign({name:s}, collectOpts()), status);
    const fr = (r && r.frames) || [];
    if(sameSelection(s,k)){
      const missing = r.warnings && r.warnings.length ? ` · missing textures: ${r.warnings.join(", ")}` : "";
      setStatus(`rendered ${fr.length} frames ✓${missing}`);
      playFrames(fr); showLinks({archive:r.archive});
    }
  }catch(e){ if(sameSelection(s,k)) setStatus("error: "+e.message); }
  finally{ if(sameSelection(s,k)) busy(false); }
}

function showLinks(r){
  const l = $("#links"); l.innerHTML="";
  const t = Date.now();
  if(r.glb) l.innerHTML += `<a href="${r.glb}?t=${t}" download>⬇ glb</a>`;
  if(r.coords) l.innerHTML += `<a href="${r.coords}?t=${t}" target="_blank">Coords.json</a>`;
  if(r.archive) l.innerHTML += `<a href="${r.archive}?t=${t}" download>⬇ frames ZIP</a>`;
}
function stopAnim(){ if(timer){ clearInterval(timer); timer=null; } }
function playFrames(fr){
  const t = Date.now();
  frames = fr.map(url => `${url}?t=${t}`);
  fi = 0;
  $("#scrub").max = Math.max(0, frames.length-1); $("#scrub").value = 0;
  $("#fcount").textContent = frames.length+" frames";
  if(!frames.length){ $("#viewer").innerHTML='<span class="mut">no frames</span>'; return; }
  $("#viewer").innerHTML = `<img id="frame" src="${frames[0]}">`;
  startAnim();
}
function startAnim(){
  stopAnim(); $("#play").textContent="⏸ Pause";
  const ms = +$("#speed").value;
  timer = setInterval(()=>{ fi=(fi+1)%frames.length; show(fi); }, ms);
}
function show(i){ fi=i; $("#frame").src=frames[i]; $("#scrub").value=i; }

$("#play").onclick = ()=>{ if(timer){ stopAnim(); $("#play").textContent="▶ Play"; } else startAnim(); };
$("#scrub").oninput = e=>{ if(frames.length){ stopAnim(); $("#play").textContent="▶ Play"; show(+e.target.value); } };
$("#speed").oninput = ()=>{ if(timer) startAnim(); };
$("#search").oninput = renderList;
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); kind=b.dataset.kind; sel=null;
  $("#empty").style.display="block"; $("#detail").style.display="none";
  loadList();
});
let TEX_NAMES = [];
let textureInput = null, textureMatches = [], textureActiveIndex = -1;
const TEXTURE_ROW_HEIGHT = 30, TEXTURE_OVERSCAN = 3, TEXTURE_VISIBLE_ROWS = 32;
const texturePicker = $("#texture-picker");

function renderTextureOptions(){
  const count = textureMatches.length;
  const previousScrollTop = texturePicker.scrollTop;
  texturePicker.replaceChildren();
  if(!TEX_NAMES.length){
    const msg = document.createElement("div");
    msg.className = "picker-message";
    msg.textContent = "Loading texture names…";
    texturePicker.append(msg);
    texturePicker.scrollTop = previousScrollTop;
    return;
  }
  if(!count){
    const msg = document.createElement("div");
    msg.className = "picker-message";
    msg.textContent = "No matching textures.";
    texturePicker.append(msg);
    texturePicker.scrollTop = previousScrollTop;
    return;
  }

  const first = Math.max(0, Math.floor(previousScrollTop / TEXTURE_ROW_HEIGHT) - TEXTURE_OVERSCAN);
  const last = Math.min(count, first + TEXTURE_VISIBLE_ROWS);
  if(first){
    const spacer = document.createElement("div");
    spacer.setAttribute("aria-hidden", "true");
    spacer.style.height = `${first * TEXTURE_ROW_HEIGHT}px`;
    texturePicker.append(spacer);
  }
  for(let i=first; i<last; i++){
    const option = document.createElement("div");
    option.id = `texture-option-${i}`;
    option.setAttribute("role", "option");
    option.setAttribute("aria-selected", String(i === textureActiveIndex));
    option.setAttribute("aria-posinset", String(i + 1));
    option.setAttribute("aria-setsize", String(count));
    option.dataset.index = String(i);
    option.title = textureMatches[i];
    option.textContent = textureMatches[i];
    texturePicker.append(option);
  }
  if(last < count){
    const spacer = document.createElement("div");
    spacer.setAttribute("aria-hidden", "true");
    spacer.style.height = `${(count - last) * TEXTURE_ROW_HEIGHT}px`;
    texturePicker.append(spacer);
  }
  texturePicker.scrollTop = previousScrollTop;
}

function positionTexturePicker(){
  if(!textureInput || texturePicker.hidden || !textureInput.isConnected) return;
  const rect = textureInput.getBoundingClientRect();
  const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const viewportWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const desiredHeight = Math.min(280, Math.max(42, Math.min(textureMatches.length, 8) * TEXTURE_ROW_HEIGHT + 8));
  const roomBelow = Math.max(0, viewportHeight - rect.bottom - 8);
  const roomAbove = Math.max(0, rect.top - 8);
  const openAbove = roomBelow < desiredHeight && roomAbove > roomBelow;
  const room = openAbove ? roomAbove : roomBelow;
  const height = Math.max(38, Math.min(desiredHeight, room || desiredHeight));
  const width = Math.min(Math.max(280, rect.width), Math.max(1, viewportWidth - 16));
  const left = Math.max(8, Math.min(rect.left, viewportWidth - width - 8));
  let top = openAbove ? rect.top - height - 4 : rect.bottom + 4;
  top = Math.max(8, Math.min(top, viewportHeight - height - 8));
  texturePicker.style.left = `${left}px`;
  texturePicker.style.top = `${top}px`;
  texturePicker.style.width = `${width}px`;
  texturePicker.style.height = `${height}px`;
}

function openTexturePicker(input, resetScroll=false){
  if(!input || !input.isConnected) return;
  if(textureInput !== input){
    textureInput = input;
    textureActiveIndex = -1;
    resetScroll = true;
  }
  if(resetScroll) texturePicker.scrollTop = 0;
  input.setAttribute("role", "combobox");
  input.setAttribute("aria-autocomplete", "list");
  input.setAttribute("aria-expanded", "true");
  input.setAttribute("aria-controls", "texture-picker");
  input.removeAttribute("aria-activedescendant");
  const query = input.value.trim().replace(/\.atf$/i, "").toLowerCase();
  textureMatches = query ? TEX_NAMES.filter(n=>n.toLowerCase().includes(query)) : TEX_NAMES;
  texturePicker.hidden = false;
  renderTextureOptions();
  positionTexturePicker();
}

function closeTexturePicker(){
  if(textureInput){
    textureInput.setAttribute("aria-expanded", "false");
    textureInput.removeAttribute("aria-activedescendant");
  }
  texturePicker.hidden = true;
  texturePicker.replaceChildren();
  textureInput = null;
  textureMatches = [];
  textureActiveIndex = -1;
}

function activateTextureOption(index){
  if(!textureInput || !textureMatches.length) return;
  textureActiveIndex = Math.max(0, Math.min(index, textureMatches.length - 1));
  const rowTop = textureActiveIndex * TEXTURE_ROW_HEIGHT;
  const rowBottom = rowTop + TEXTURE_ROW_HEIGHT;
  if(rowTop < texturePicker.scrollTop) texturePicker.scrollTop = rowTop;
  else if(rowBottom > texturePicker.scrollTop + texturePicker.clientHeight)
    texturePicker.scrollTop = rowBottom - texturePicker.clientHeight;
  renderTextureOptions();
  textureInput.setAttribute("aria-activedescendant", `texture-option-${textureActiveIndex}`);
}

function chooseTextureOption(index){
  if(!textureInput || !textureMatches[index]) return;
  const input = textureInput;
  input.value = textureMatches[index];
  validateTextureInput(input);
  input.dispatchEvent(new Event("change", {bubbles:true}));
  closeTexturePicker();
  input.focus();
}

document.addEventListener("focusin", e=>{
  if(e.target.classList && e.target.classList.contains("tex")) openTexturePicker(e.target, true);
});
document.addEventListener("focusout", e=>{
  if(e.target.classList && e.target.classList.contains("tex"))
    setTimeout(()=>{ if(textureInput === e.target && document.activeElement !== e.target) closeTexturePicker(); }, 0);
});
document.addEventListener("input", e=>{
  if(e.target.classList && e.target.classList.contains("tex")){
    validateTextureInput(e.target);
    openTexturePicker(e.target, true);
  }
});
document.addEventListener("keydown", e=>{
  if(!e.target.classList || !e.target.classList.contains("tex")) return;
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    if(textureInput !== e.target || texturePicker.hidden) openTexturePicker(e.target);
    if(textureMatches.length){
      const step = e.key === "ArrowDown" ? 1 : -1;
      activateTextureOption(textureActiveIndex < 0 ? (step > 0 ? 0 : textureMatches.length - 1) : textureActiveIndex + step);
    }
  } else if(e.key === "Enter" && textureInput === e.target && textureActiveIndex >= 0){
    e.preventDefault();
    chooseTextureOption(textureActiveIndex);
  } else if(e.key === "Escape" && textureInput === e.target){
    e.preventDefault();
    closeTexturePicker();
  }
});
texturePicker.addEventListener("scroll", renderTextureOptions);
texturePicker.addEventListener("pointerdown", e=>{
  const option = e.target.closest("[role=option]");
  if(option) e.preventDefault();
});
texturePicker.addEventListener("click", e=>{
  const option = e.target.closest("[role=option]");
  if(option) chooseTextureOption(+option.dataset.index);
});
document.addEventListener("pointerdown", e=>{
  if(texturePicker.hidden || texturePicker.contains(e.target) ||
     (e.target.classList && e.target.classList.contains("tex"))) return;
  closeTexturePicker();
});
window.addEventListener("resize", positionTexturePicker);
window.addEventListener("scroll", positionTexturePicker, true);

function validateTextureInput(el){
  const val = el.value.trim();
  if(!val){ el.style.borderColor = ""; return; }
  const clean = val.endsWith(".atf") ? val.slice(0, -4) : val;
  if(TEX_NAMES.includes(clean)){
    el.style.borderColor = "";
  } else {
    el.style.borderColor = "var(--err)";
  }
}
async function loadTextures(){
  try{
    TEX_NAMES = (await jget("/api/textures")).items;
    document.querySelectorAll(".tex").forEach(validateTextureInput);
    if(textureInput && document.activeElement === textureInput) openTexturePicker(textureInput, true);
  }
  catch(e){}
}
loadList(); loadTextures();
</script>
