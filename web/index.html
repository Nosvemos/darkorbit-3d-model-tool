<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarkOrbit 3D Tool</title>
<style>
  :root { --bg:#15171c; --panel:#1d2026; --panel2:#23272f; --line:#2e333d;
          --fg:#d6d9df; --mut:#8b909a; --acc:#ff7a18; --acc2:#39b0ff; --err:#ff4a4a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  header { position:relative; z-index:20; display:flex; align-items:center;
           min-height:49px; padding:6px 18px; border-bottom:1px solid var(--line);
           font-weight:600; letter-spacing:.3px; }
  .brand { white-space:nowrap; }
  .brand span { color:var(--acc); }
  .queue-control { position:relative; margin-left:42px; font-weight:400;
                   letter-spacing:normal; }
  .queue-trigger { position:relative; display:grid; place-items:center; width:36px; height:36px;
    padding:0; color:var(--mut); background:transparent; border:1px solid transparent;
    border-radius:7px; cursor:pointer; }
  .queue-trigger:hover, .queue-trigger:focus-visible, .queue-control[data-open="true"] .queue-trigger {
    color:var(--fg); background:var(--panel2); border-color:var(--line); outline:none; }
  .queue-trigger[data-state="running"] { color:#8bd2ff; }
  .queue-trigger[data-state="queued"] { color:#ffd09b; }
  .queue-trigger[data-state="paused"] { color:#ffcb76; }
  .queue-trigger[data-state="done"] { color:#9be3ad; }
  .queue-trigger[data-state="error"] { color:#ff9b9b; }
  .queue-trigger svg { width:20px; height:20px; fill:none; stroke:currentColor;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .queue-indicator { position:absolute; right:2px; bottom:2px; width:9px; height:9px;
    border:1px solid var(--panel); border-radius:50%; background:#77808d; }
  .queue-indicator[hidden] { display:none; }
  .queue-indicator.running { border:2px solid #8bd2ff; border-right-color:transparent;
    background:var(--panel); animation:queue-spin .9s linear infinite; }
  .queue-indicator.queued { background:#ffd09b; }
  .queue-indicator.paused { width:10px; border-radius:3px; background:#ffcb76; }
  .queue-indicator.done { background:#9be3ad; }
  .queue-indicator.error { background:#ff9b9b; }
  @keyframes queue-spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .queue-indicator.running { animation:none; } }
  .queue-badge { position:absolute; top:-3px; right:-4px; min-width:17px; height:17px;
    padding:0 4px; display:grid; place-items:center; border:2px solid var(--panel);
    border-radius:10px; background:var(--acc); color:#201006; font:700 10px/1 system-ui,sans-serif; }
  .queue-badge.history { min-width:9px; width:9px; height:9px; top:1px; right:0;
    padding:0; border:1px solid var(--panel); }
  .queue-popover { position:absolute; top:100%; left:0; width:min(410px,calc(100vw - 36px));
    max-height:min(70vh,560px); display:flex; flex-direction:column; overflow:hidden;
    color:var(--fg); background:var(--panel); border:1px solid #3a414d; border-radius:9px;
    box-shadow:0 12px 32px #000b; }
  .queue-popover[hidden] { display:none; }
  .wrap { display:flex; height:calc(100vh - 49px); }
  aside { width:280px; border-right:1px solid var(--line); display:flex;
          flex-direction:column; background:var(--panel); }
  .tabs { display:flex; }
  .tabs button { flex:1; background:none; border:none; color:var(--mut);
                 padding:10px 0; cursor:pointer; border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--fg); border-bottom-color:var(--acc); }
  #search { margin:8px; padding:7px 9px; background:var(--panel2);
            border:1px solid var(--line); color:var(--fg); border-radius:6px; }
  #list { overflow:auto; flex:1; }
  #list div { padding:6px 14px; cursor:pointer; color:var(--mut);
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #list div:hover { background:var(--panel2); }
  #list div.on { background:var(--panel2); color:var(--acc2);
                 border-left:3px solid var(--acc2); padding-left:11px; }
  main { flex:1; overflow:auto; padding:18px 22px; }
  h2 { margin:0 0 4px; }
  .mut { color:var(--mut); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:14px 16px; margin:14px 0; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px;
          color:var(--mut); }
  input, select { background:var(--panel2); border:1px solid var(--line);
                  color:var(--fg); border-radius:6px; padding:6px 8px; }
  input[type=number] { width:90px; }
  button.act { background:var(--acc); color:#160d04; border:none; font-weight:600;
               padding:8px 16px; border-radius:6px; cursor:pointer; }
  button.act.alt { background:var(--acc2); color:#04121c; }
  button.act:disabled { opacity:.5; cursor:default; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td,th { text-align:left; padding:3px 10px 3px 0; }
  th { color:var(--mut); font-weight:500; }
  .pt { color:var(--acc2); }
  #status { color:var(--mut); min-height:20px; }
  #stage { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  #viewer { background:#0d0f13 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="10" height="10" fill="%23191b20"/><rect x="10" y="10" width="10" height="10" fill="%23191b20"/></svg>');
            border:1px solid var(--line); border-radius:8px; width:340px; height:340px;
            display:flex; align-items:center; justify-content:center; }
  #viewer img { max-width:100%; max-height:100%; image-rendering:auto; }
  .links a { color:var(--acc2); margin-right:14px; }
  .queue-head { flex:0 0 auto; display:grid; gap:10px;
    padding:12px 14px; border-bottom:1px solid var(--line); }
  .queue-title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .queue-heading { min-width:0; display:flex; flex-direction:column; gap:1px; }
  .queue-heading h2 { font-size:15px; margin:0; }
  #queue-summary { font-size:12px; }
  .queue-head-actions { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
  .queue-toggle, .queue-cancel { background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:5px 9px; cursor:pointer; }
  .queue-toggle { display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .queue-toggle svg { width:14px; height:14px; fill:none; stroke:currentColor;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .queue-run-toggle { margin-right:auto; color:#ffcb76; }
  .queue-run-toggle.resume { color:#9be3ad; }
  .queue-clear { color:var(--mut); }
  .queue-close { width:28px; height:28px; padding:0; font-size:20px; line-height:1; }
  .queue-cancel { color:#ffb3a9; border-color:#69433f; }
  .queue-toggle:hover, .queue-cancel:hover { filter:brightness(1.2); }
  .queue-toggle:disabled, .queue-cancel:disabled { opacity:.5; cursor:default; }
  #queue-list { flex:1 1 auto; display:grid; gap:8px; padding:10px; overflow-y:auto; min-height:0;
    overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#596170 #23272f; }
  #queue-list::-webkit-scrollbar { width:9px; }
  #queue-list::-webkit-scrollbar-track { background:#23272f; }
  #queue-list::-webkit-scrollbar-thumb { background:#596170; border:2px solid #23272f;
    border-radius:7px; }
  .queue-job { background:var(--panel2); border:1px solid var(--line); border-radius:7px;
    padding:9px 11px; min-width:0; }
  .queue-job-top { display:flex; justify-content:space-between; align-items:center;
    gap:10px; }
  .queue-job-title { display:flex; align-items:center; flex-wrap:wrap; gap:7px; min-width:0; }
  .queue-job-title strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .queue-state { font-size:11px; border:1px solid var(--line); border-radius:20px;
    padding:1px 8px; color:var(--mut); white-space:nowrap; }
  .queue-state.running { color:#8bd2ff; border-color:#31516a; }
  .queue-state.queued { color:#ffd09b; border-color:#695136; }
  .queue-state.cancelling { color:#ffcb76; border-color:#695136; }
  .queue-state.done { color:#9be3ad; border-color:#355f40; }
  .queue-state.error { color:#ff9b9b; border-color:#694040; }
  .queue-state.cancelled { color:#a9adb5; }
  .queue-job-meta, .queue-job-log { color:var(--mut); font-size:12px; overflow-wrap:anywhere; }
  .queue-job-meta { margin-top:3px; }
  .queue-job-log { margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .queue-links { margin-top:5px; display:flex; gap:12px; flex-wrap:wrap; font-size:12px; }
  .queue-links a { color:var(--acc2); }
  .queue-empty { padding:0 14px 14px; font-size:12px; }
  .pill { font-size:11px; background:var(--panel2); border:1px solid var(--line);
          padding:2px 8px; border-radius:20px; color:var(--mut); }
  header { background:linear-gradient(90deg,#1d2026,#15171c); }
  .card { box-shadow:0 1px 0 #00000022; }
  button.act:hover { filter:brightness(1.08); }
  details summary { cursor:pointer; color:var(--acc2); font-size:13px;
                    user-select:none; outline:none; }
  details[open] summary { margin-bottom:2px; }
  label.chk { flex-direction:row; align-items:center; gap:6px; color:var(--fg);
              font-size:13px; }
  input[type=range] { accent-color:var(--acc); }
  #list::-webkit-scrollbar, main::-webkit-scrollbar { width:9px; }
  #list::-webkit-scrollbar-thumb, main::-webkit-scrollbar-thumb {
    background:var(--line); border-radius:6px; }
  [hidden] { display:none !important; }
  #texture-picker { position:fixed; z-index:10000; overflow-y:auto; overflow-x:hidden;
                    overscroll-behavior:contain; scrollbar-width:thin;
                    scrollbar-color:#596170 #23272f; padding:4px;
                    color:var(--fg); background:var(--panel2);
                    border:1px solid #49505c; border-radius:7px;
                    box-shadow:0 8px 24px #0009; }
  #texture-picker::-webkit-scrollbar { width:10px; }
  #texture-picker::-webkit-scrollbar-track { background:#23272f; border-radius:6px; }
  #texture-picker::-webkit-scrollbar-thumb { background:#596170; border:2px solid #23272f;
                                              border-radius:7px; }
  #texture-picker [role=option] { display:block; width:100%; height:30px; padding:4px 8px;
                                  border:0; border-bottom:1px solid #303640;
                                  background:transparent; color:var(--fg); text-align:left;
                                  font:12px/21px ui-monospace,SFMono-Regular,Consolas,monospace;
                                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                                  cursor:pointer; }
  #texture-picker [role=option]:hover, #texture-picker [role=option][aria-selected=true] {
    background:#343b46; color:#fff; }
  #texture-picker .picker-message { padding:7px 9px; color:var(--mut); font-size:12px; }
  @media (max-width:760px) {
    .queue-control { margin-left:auto; }
    .queue-popover { left:auto; right:-12px; width:min(410px,calc(100vw - 24px)); }
    .wrap { display:block; height:auto; min-height:calc(100vh - 49px); }
    aside { width:100%; height:220px; border-right:0; border-bottom:1px solid var(--line); }
    main { overflow:visible; padding:14px; }
    #viewer { width:min(340px,100%); height:auto; aspect-ratio:1; }
    input.tex { width:190px; max-width:100%; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">DarkOrbit <span>3D</span> Tool</div>
  <div id="queue-control" class="queue-control">
    <button id="queue-trigger" class="queue-trigger" type="button" aria-label="Render queue"
      aria-haspopup="dialog" aria-expanded="false" aria-controls="queue-popover" title="Render queue">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span id="queue-indicator" class="queue-indicator" aria-hidden="true" hidden></span>
      <span id="queue-badge" class="queue-badge" hidden></span>
    </button>
    <section id="queue-popover" class="queue-popover" role="dialog" aria-modal="false"
      aria-labelledby="queue-title" hidden>
      <div class="queue-head">
        <div class="queue-title-row">
          <div class="queue-heading">
            <h2 id="queue-title">Render queue</h2>
            <span id="queue-summary" class="mut" aria-live="polite">Loading jobs…</span>
          </div>
          <button class="queue-toggle queue-close" id="queue-close" type="button" aria-label="Close render queue" title="Close">×</button>
        </div>
        <div class="queue-head-actions">
          <button class="queue-toggle queue-run-toggle" id="queue-run-toggle" type="button">
            <svg id="queue-run-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg>
            <span id="queue-run-label">Pause queue</span>
          </button>
          <button class="queue-toggle" id="queue-history" type="button" hidden>Show history</button>
          <button class="queue-toggle queue-clear" id="queue-clear" type="button" disabled
            title="Remove finished jobs from history. Output files are kept.">Clear history</button>
          <button class="queue-toggle" id="queue-refresh" type="button" title="Refresh queue">Refresh</button>
        </div>
      </div>
      <div id="queue-list"></div>
      <div id="queue-empty" class="queue-empty mut" hidden>No queued or recent jobs. Start a render, conversion, or effect simulation to add one.</div>
    </section>
  </div>
</header>
<div class="wrap">
  <aside>
    <div class="tabs">
      <button data-kind="meshes" class="on">Meshes</button>
      <button data-kind="fx">FX Meshes</button>
      <button data-kind="effects">Effects</button>
    </div>
    <input id="search" placeholder="filter…">
    <div id="list"></div>
  </aside>
  <main>
    <div id="empty" class="mut">Select an asset on the left.</div>
    <div id="detail" style="display:none">
      <h2 id="title"></h2>
      <div id="meta" class="mut"></div>

      <div class="card" id="info"></div>

      <div class="card" id="actions"></div>

      <div class="card">
        <div id="status">Ready.</div>
        <div id="stage" style="margin-top:12px">
          <div id="viewer"><span class="mut">no preview yet</span></div>
          <div>
            <div class="row" style="margin-bottom:8px">
              <button class="act alt" id="play">⏸ Pause</button>
              <label>Frame <input type="range" id="scrub" min="0" value="0"></label>
              <label>Speed <input type="range" id="speed" min="20" max="200" value="80"></label>
              <span id="fcount" class="pill"></span>
            </div>
            <div class="links" id="links"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="texture-picker" role="listbox" aria-label="ATF texture suggestions" hidden></div>
<script>
const $ = s => document.querySelector(s);
let kind = "meshes", sel = null, items = [];
let frames = [], fi = 0, timer = null;
let queueHistoryVisible = false;
let queueOpen = false, queuePaused = false;
let queueClearing = false;

const isFx = () => kind === "fx";
const isEffect = () => kind === "effects";

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error((await r.json()).error||r.status); return r.json(); }
async function jpost(u,b){ const r = await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); if(!r.ok) throw new Error((await r.json()).error||r.status); return r.json(); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
// start a background job, poll it, stream its latest log line into the status
async function runJob(endpoint, body, updateStatus){
  updateStatus = updateStatus || setStatus;
  const {job} = await jpost(endpoint, body);
  refreshJobs();
  const t0 = Date.now();
  while(true){
    await sleep(700);
    const s = await jget("/api/job?id="+job);
    const secs = ((Date.now()-t0)/1000).toFixed(0);
    const last = s.log && s.log.length ? s.log[s.log.length-1] : "working";
    if(s.status==="queued") {
      const pos = s.queue_position ? ` #${s.queue_position}` : "";
      updateStatus(`queued${pos} (${secs}s)`.slice(0,90));
    }
    else if(s.status==="running" || s.status==="cancelling") updateStatus(`${s.status} · ${secs}s · ${last}`.slice(0,90));
    else if(s.status==="done") return s.result;
    else throw new Error(s.error || s.status);
  }
}

function queueType(job){
  if(job.job_type === "/api/fx") return "Particle effect";
  if(job.job_type === "/api/convert") return job.fx ? "FX conversion" : "Conversion";
  if(job.job_type === "/api/render") return job.fx ? "FX mesh render" : "Sprite render";
  return "Job";
}
function queueElement(tag, className, value){
  const el = document.createElement(tag);
  if(className) el.className = className;
  if(value !== undefined) el.textContent = value;
  return el;
}
function addQueueLink(parent, href, label){
  if(!href) return;
  const link = queueElement("a", "", label);
  link.href = href;
  link.target = "_blank";
  if(label === "GLB" || label === "Frames ZIP") link.download = "";
  parent.append(link);
}
function setQueueOpen(open, restoreFocus=false){
  queueOpen = !!open;
  $("#queue-popover").hidden = !queueOpen;
  $("#queue-control").dataset.open = String(queueOpen);
  $("#queue-trigger").setAttribute("aria-expanded", String(queueOpen));
  if(restoreFocus) $("#queue-trigger").focus();
}
const queueControl = $("#queue-control");
$("#queue-trigger").addEventListener("click", ()=>{
  setQueueOpen(!queueOpen);
});
$("#queue-close").addEventListener("click", ()=>{
  setQueueOpen(false, true);
});
document.addEventListener("pointerdown", e=>{
  if(queueOpen && !queueControl.contains(e.target)) setQueueOpen(false);
});
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && queueOpen) setQueueOpen(false, true);
});
function renderQueue(data){
  const jobs = data.jobs || [];
  const list = $("#queue-list");
  list.replaceChildren();
  const active = jobs.filter(j=>["running","cancelling","queued"].includes(j.status));
  const history = jobs.filter(j=>["done","error","cancelled"].includes(j.status));
  const visibleHistory = queueHistoryVisible ? history : history.slice(0,3);
  const visible = [...active, ...visibleHistory];
  const queued = data.counts?.queued || 0, running = data.counts?.running || 0;
  $("#queue-summary").textContent = running || queued
    ? `${running} running · ${queued} waiting`
    : history.length ? "Idle · recent jobs below" : "Idle";
  queuePaused = !!data.paused;
  const summary = $("#queue-summary");
  if(queuePaused){
    summary.textContent = running
      ? "Paused after current job · " + queued + " waiting"
      : queued ? "Paused · " + queued + " waiting" : "Paused · new jobs will wait";
  } else if(running || queued){
    summary.textContent = running + " running · " + queued + " waiting";
  } else {
    summary.textContent = history.length ? "Idle · recent jobs below" : "Idle";
  }
  const runToggle = $("#queue-run-toggle");
  const runLabel = queuePaused ? "Resume queue"
    : running ? "Pause after current" : "Pause queue";
  $("#queue-run-label").textContent = runLabel;
  runToggle.setAttribute("aria-label", runLabel);
  runToggle.title = queuePaused ? "Resume starting queued jobs"
    : running ? "Finish the active job, then pause the queue"
    : "Hold queued and future jobs";
  runToggle.classList.toggle("resume", queuePaused);
  $("#queue-run-icon").innerHTML = queuePaused
    ? '<path d="m5 3 9 5-9 5z"/>'
    : '<path d="M5 3v10M11 3v10"/>';
  const badge = $("#queue-badge");
  const activeCount = running + queued;
  badge.classList.toggle("history", !activeCount && history.length > 0);
  badge.textContent = activeCount ? String(activeCount > 99 ? "99+" : activeCount) : "";
  badge.hidden = !activeCount && history.length === 0;
  const state = queuePaused ? "paused" : running ? "running" : queued ? "queued"
    : history.some(j=>j.status === "error") ? "error" : history.length ? "done" : "idle";
  const indicator = $("#queue-indicator");
  indicator.className = "queue-indicator " + state;
  indicator.hidden = state === "idle";
  const triggerLabel = queuePaused
    ? "Render queue paused, " + queued + " waiting"
    : activeCount ? "Render queue, " + running + " running and " + queued + " waiting"
    : history.length ? "Render queue, " + history.length + " recent jobs" : "Render queue";
  $("#queue-trigger").dataset.state = state;
  $("#queue-trigger").setAttribute("aria-label", triggerLabel);
  $("#queue-trigger").title = triggerLabel;
  const historyButton = $("#queue-history");
  historyButton.hidden = history.length <= 3;
  historyButton.textContent = queueHistoryVisible ? "Hide history" : `Show history (${history.length})`;
  const clearButton = $("#queue-clear");
  clearButton.disabled = queueClearing || history.length === 0;
  $("#queue-empty").hidden = visible.length > 0;

  visible.forEach(job=>{
    const card = queueElement("article", "queue-job");
    const top = queueElement("div", "queue-job-top");
    const title = queueElement("div", "queue-job-title");
    title.append(queueElement("strong", "", job.asset || "Job"));
    title.append(queueElement("span", "pill", queueType(job)));
    title.append(queueElement("span", `queue-state ${job.status}`, job.status));
    top.append(title);
    if(job.cancelable){
      const cancel = queueElement("button", "queue-cancel",
        job.status === "queued" ? "Cancel" : "Cancel job");
      cancel.type = "button";
      cancel.disabled = job.status === "cancelling";
      cancel.addEventListener("click", async ()=>{
        cancel.disabled = true;
        try { await jpost("/api/job/cancel", {id:job.id}); }
        catch(e) { $("#queue-summary").textContent = `Cancel failed: ${e.message}`; }
        refreshJobs();
      });
      top.append(cancel);
    }
    card.append(top);

    let meta = job.status === "queued"
      ? `Queue position ${job.queue_position || "—"}`
      : job.status === "running" ? "Running now"
      : job.status === "cancelling" ? "Stopping process and cleaning partial output…"
      : job.status === "done" ? "Completed"
      : job.status === "cancelled" ? "Cancelled"
      : `Failed · ${job.error || "unknown error"}`;
    if(job.output_name){
      meta += job.output_name === job.requested_output_name
        ? ` · output ${job.output_name}`
        : ` · output ${job.requested_output_name} → ${job.output_name}`;
    }
    card.append(queueElement("div", "queue-job-meta", meta));
    const last = (job.log || []).filter(Boolean).slice(-1)[0];
    if(last && !["queued", "started"].includes(last))
      card.append(queueElement("div", "queue-job-log", last));

    if(job.status === "done" && job.result){
      const links = queueElement("div", "queue-links");
      addQueueLink(links, job.result.glb, "GLB");
      addQueueLink(links, job.result.coords, "Coords.json");
      addQueueLink(links, job.result.archive, "Frames ZIP");
      if(job.result.first_frame) addQueueLink(links, job.result.first_frame, "First frame");
      if(job.result.frame_count) links.append(queueElement("span", "mut", `${job.result.frame_count} frames`));
      if(links.childNodes.length) card.append(links);
    }
    list.append(card);
  });
}

function saveSettings(){
  const saved = {};
  const profileOverrides = {};
  document.querySelectorAll("#actions .opt").forEach(el=>{
    saved[el.dataset.key] = el.value;
    if(el.dataset.profileOverride === "1")
      profileOverrides[el.dataset.key] = el.type === "number" ? +el.value : el.value;
  });
  document.querySelectorAll("#actions .optbool").forEach(el=>{
    saved[el.dataset.key] = el.checked;
    if(el.dataset.profileOverride === "1")
      profileOverrides[el.dataset.key] = el.dataset.invert ? el.checked : !el.checked;
  });
  saved["_profile_overrides"] = profileOverrides;
  const gltfEl = $("#o_gltf");
  const objEl = $("#o_obj");
  if(gltfEl) saved["_gltf"] = gltfEl.checked;
  if(objEl) saved["_obj"] = objEl.checked;
  return saved;
}

function restoreSettings(saved, profileKeys = new Set()){
  if(!saved) return;
  const profileOverrides = saved["_profile_overrides"] || {};
  document.querySelectorAll("#actions .opt").forEach(el=>{
    const key = el.dataset.key;
    if (key in saved && key !== "output_name" && key !== "overlay" && key !== "crop_align" &&
        (!profileKeys.has(key) || key in profileOverrides)) {
      el.value = profileKeys.has(key) ? profileOverrides[key] : saved[key];
      if(profileKeys.has(key)) el.dataset.profileOverride = "1";
    }
  });
  document.querySelectorAll("#actions .optbool").forEach(el=>{
    const key = el.dataset.key;
    if (key in saved && (!profileKeys.has(key) || key in profileOverrides)) {
      if(profileKeys.has(key)) {
        const value = profileOverrides[key];
        el.checked = el.dataset.invert ? !!value : !value;
      } else {
        el.checked = !!saved[key];
      }
      if(profileKeys.has(key)) el.dataset.profileOverride = "1";
    }
  });
  const gltfEl = $("#o_gltf");
  const objEl = $("#o_obj");
  if(gltfEl && "_gltf" in saved) gltfEl.checked = saved["_gltf"];
  if(objEl && "_obj" in saved) objEl.checked = saved["_obj"];
}

// gather every .opt / .optbool input in the actions panel into an override dict
function collectOpts(){

  document.querySelectorAll("#actions .opt").forEach(el=>{
    if(el.value==="") return;
    o[el.dataset.key] = el.type==="number" ? +el.value : el.value;
  });
  document.querySelectorAll("#actions .optbool").forEach(el=>{
    o[el.dataset.key] = el.dataset.invert ? el.checked : !el.checked;
  });
  return o;
}
function collectProfileOverrides(){
  const o = {};
  document.querySelectorAll('#actions .opt[data-profile-override="1"]').forEach(el=>{
    o[el.dataset.key] = el.type === "number" ? +el.value : el.value;
  });
  document.querySelectorAll('#actions .optbool[data-profile-override="1"]').forEach(el=>{
    o[el.dataset.key] = el.dataset.invert ? el.checked : !el.checked;
  });

}

function busy(b){ document.querySelectorAll("#actions button").forEach(x=>x.disabled=b); }
function sameSelection(s,k){ return sel===s && kind===k; }
function jobFailure(e){ return e.message === "cancelled" ? "cancelled" : "error: "+e.message; }

async function runConvert(){
  const s = sel, k = kind;
  const status = t => { if(sameSelection(s,k)) setStatus(t); };
  busy(true); setStatus("converting… (Blender)");
  try{
    const r = await runJob("/api/convert",{
      name: s,
      fx: k==="fx",
      gltf: $("#o_gltf").checked,
      obj: $("#o_obj").checked,
      textures: collectTextures(),
      clip: ($("#o_clip")||{}).value||"",
      overlay: ($("#o_overlay")||{}).value||"",
      output_name: ($("#o_output_name")||{}).value||"",
      hide_objects: collectHiddenObjects()
    }, status);
    if(sameSelection(s,k)){ setStatus("converted ✓"); showLinks({glb:r.glb}); }
  }catch(e){ if(sameSelection(s,k)) setStatus(jobFailure(e)); }
  finally{ if(sameSelection(s,k)) busy(false); }
}
async function runRender(){
  const s = sel, k = kind;
  const status = t => { if(sameSelection(s,k)) setStatus(t); };
  busy(true); setStatus("rendering sprites… (Blender)");
  try{
    const r = await runJob("/api/render", Object.assign({
      name: s,
      fx: k==="fx",
      textures: collectTextures(),
      clip: ($("#o_clip")||{}).value||"",
      hide_objects: collectHiddenObjects()
    }, Object.assign(collectOpts(), {profile_overrides: collectProfileOverrides()})), status);
    const fr = (r && r.frames) || [];
    if(sameSelection(s,k)){
      setStatus(`rendered ${fr.length} frames ✓`);
      playFrames(fr); showLinks(r || {});
    }
  }catch(e){ if(sameSelection(s,k)) setStatus(jobFailure(e)); }
  finally{ if(sameSelection(s,k)) busy(false); }
}
async function runFx(){
  const s = sel, k = kind;
  const status = t => { if(sameSelection(s,k)) setStatus(t); };
  const invalid = [...document.querySelectorAll('#actions input[type="number"]')]
    .find(el=>!el.checkValidity());
  if(invalid){ invalid.reportValidity(); return; }
  busy(true); setStatus("simulating particles…");
  try{
    const r = await runJob("/api/fx", Object.assign({name:s}, collectOpts()), status);
    const fr = (r && r.frames) || [];
    if(sameSelection(s,k)){
      const missing = r.warnings && r.warnings.length ? ` · missing textures: ${r.warnings.join(", ")}` : "";
      setStatus(`rendered ${fr.length} frames ✓${missing}`);
      playFrames(fr); showLinks({archive:r.archive});
    }
  }catch(e){ if(sameSelection(s,k)) setStatus(jobFailure(e)); }
  finally{ if(sameSelection(s,k)) busy(false); }
}

let TEX_NAMES = [];
let textureInput = null, textureMatches = [], textureActiveIndex = -1;
const TEXTURE_ROW_HEIGHT = 30, TEXTURE_OVERSCAN = 3, TEXTURE_VISIBLE_ROWS = 32;
const texturePicker = $("#texture-picker");

function renderTextureOptions(){
  const count = textureMatches.length;
  const previousScrollTop = texturePicker.scrollTop;
  texturePicker.replaceChildren();
  if(!TEX_NAMES.length){
    const msg = document.createElement("div");
    msg.className = "picker-message";
    msg.textContent = "Loading texture names…";
    texturePicker.append(msg);
    texturePicker.scrollTop = previousScrollTop;
    return;
  }
  if(!count){
    const msg = document.createElement("div");
    msg.className = "picker-message";
    msg.textContent = "No matching textures.";
    texturePicker.append(msg);
    texturePicker.scrollTop = previousScrollTop;
    return;
  }

  const first = Math.max(0, Math.floor(previousScrollTop / TEXTURE_ROW_HEIGHT) - TEXTURE_OVERSCAN);
  const last = Math.min(count, first + TEXTURE_VISIBLE_ROWS);
  if(first){
    const spacer = document.createElement("div");
    spacer.setAttribute("aria-hidden", "true");
    spacer.style.height = `${first * TEXTURE_ROW_HEIGHT}px`;
    texturePicker.append(spacer);
  }
  for(let i=first; i<last; i++){
    const option = document.createElement("div");
    option.id = `texture-option-${i}`;
    option.setAttribute("role", "option");
    option.setAttribute("aria-selected", String(i === textureActiveIndex));
    option.setAttribute("aria-posinset", String(i + 1));
    option.setAttribute("aria-setsize", String(count));
    option.dataset.index = String(i);
    option.title = textureMatches[i];
    option.textContent = textureMatches[i];
    texturePicker.append(option);
  }
  if(last < count){
    const spacer = document.createElement("div");
    spacer.setAttribute("aria-hidden", "true");
    spacer.style.height = `${(count - last) * TEXTURE_ROW_HEIGHT}px`;
    texturePicker.append(spacer);
  }
  texturePicker.scrollTop = previousScrollTop;
}

function positionTexturePicker(){
  if(!textureInput || texturePicker.hidden || !textureInput.isConnected) return;
  const rect = textureInput.getBoundingClientRect();
  const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const viewportWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const desiredHeight = Math.min(280, Math.max(42, Math.min(textureMatches.length, 8) * TEXTURE_ROW_HEIGHT + 8));
  const roomBelow = Math.max(0, viewportHeight - rect.bottom - 8);
  const roomAbove = Math.max(0, rect.top - 8);
  const openAbove = roomBelow < desiredHeight && roomAbove > roomBelow;
  const room = openAbove ? roomAbove : roomBelow;
  const height = Math.max(38, Math.min(desiredHeight, room || desiredHeight));
  const width = Math.min(Math.max(280, rect.width), Math.max(1, viewportWidth - 16));
  const left = Math.max(8, Math.min(rect.left, viewportWidth - width - 8));
  let top = openAbove ? rect.top - height - 4 : rect.bottom + 4;
  top = Math.max(8, Math.min(top, viewportHeight - height - 8));
  texturePicker.style.left = `${left}px`;
  texturePicker.style.top = `${top}px`;
  texturePicker.style.width = `${width}px`;
  texturePicker.style.height = `${height}px`;
}

function openTexturePicker(input, resetScroll=false){
  if(!input || !input.isConnected) return;
  if(textureInput !== input){
    textureInput = input;
    textureActiveIndex = -1;
    resetScroll = true;
  }
  if(resetScroll) texturePicker.scrollTop = 0;
  input.setAttribute("role", "combobox");
  input.setAttribute("aria-autocomplete", "list");
  input.setAttribute("aria-expanded", "true");
  input.setAttribute("aria-controls", "texture-picker");
  input.removeAttribute("aria-activedescendant");
  const query = input.value.trim().replace(/\.atf$/i, "").toLowerCase();
  textureMatches = query ? TEX_NAMES.filter(n=>n.toLowerCase().includes(query)) : TEX_NAMES;
  texturePicker.hidden = false;
  renderTextureOptions();
  positionTexturePicker();
}

function closeTexturePicker(){
  if(textureInput){
    textureInput.setAttribute("aria-expanded", "false");
    textureInput.removeAttribute("aria-activedescendant");
  }
  texturePicker.hidden = true;
  texturePicker.replaceChildren();
  textureInput = null;
  textureMatches = [];
  textureActiveIndex = -1;
}

function activateTextureOption(index){
  if(!textureInput || !textureMatches.length) return;
  textureActiveIndex = Math.max(0, Math.min(index, textureMatches.length - 1));
  const rowTop = textureActiveIndex * TEXTURE_ROW_HEIGHT;
  const rowBottom = rowTop + TEXTURE_ROW_HEIGHT;
  if(rowTop < texturePicker.scrollTop) texturePicker.scrollTop = rowTop;
  else if(rowBottom > texturePicker.scrollTop + texturePicker.clientHeight)
    texturePicker.scrollTop = rowBottom - texturePicker.clientHeight;
  renderTextureOptions();
  textureInput.setAttribute("aria-activedescendant", `texture-option-${textureActiveIndex}`);
}

function chooseTextureOption(index){
  if(!textureInput || !textureMatches[index]) return;
  const input = textureInput;
  input.value = textureMatches[index];
  validateTextureInput(input);
  input.dispatchEvent(new Event("change", {bubbles:true}));
  closeTexturePicker();
  input.focus();
}

document.addEventListener("focusin", e=>{
  if(e.target.classList && e.target.classList.contains("tex")) openTexturePicker(e.target, true);
});
document.addEventListener("focusout", e=>{
  if(e.target.classList && e.target.classList.contains("tex"))
    setTimeout(()=>{ if(textureInput === e.target && document.activeElement !== e.target) closeTexturePicker(); }, 0);
});
document.addEventListener("input", e=>{
  if(e.target.classList && e.target.classList.contains("tex")){
    validateTextureInput(e.target);
    openTexturePicker(e.target, true);
  }
});
document.addEventListener("keydown", e=>{
  if(!e.target.classList || !e.target.classList.contains("tex")) return;
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    if(textureInput !== e.target || texturePicker.hidden) openTexturePicker(e.target);
    if(textureMatches.length){
      const step = e.key === "ArrowDown" ? 1 : -1;
      activateTextureOption(textureActiveIndex < 0 ? (step > 0 ? 0 : textureMatches.length - 1) : textureActiveIndex + step);
    }
  } else if(e.key === "Enter" && textureInput === e.target && textureActiveIndex >= 0){
    e.preventDefault();
    chooseTextureOption(textureActiveIndex);
  } else if(e.key === "Escape" && textureInput === e.target){
    e.preventDefault();
    closeTexturePicker();
  }
});
texturePicker.addEventListener("scroll", renderTextureOptions);
texturePicker.addEventListener("pointerdown", e=>{
  const option = e.target.closest("[role=option]");
  if(option) e.preventDefault();
});
texturePicker.addEventListener("click", e=>{
  const option = e.target.closest("[role=option]");
  if(option) chooseTextureOption(+option.dataset.index);
});
document.addEventListener("pointerdown", e=>{
  if(texturePicker.hidden || texturePicker.contains(e.target) ||
     (e.target.classList && e.target.classList.contains("tex"))) return;
  closeTexturePicker();
});
window.addEventListener("resize", positionTexturePicker);
window.addEventListener("scroll", positionTexturePicker, true);

function validateTextureInput(el){
  const val = el.value.trim();
  if(!val){ el.style.borderColor = ""; return; }
  const clean = val.endsWith(".atf") ? val.slice(0, -4) : val;
  if(TEX_NAMES.includes(clean)){
    el.style.borderColor = "";
  } else {
    el.style.borderColor = "var(--err)";
  }
}
async function loadTextures(){
  try{
    TEX_NAMES = (await jget("/api/textures")).items;
    document.querySelectorAll(".tex").forEach(validateTextureInput);
    if(textureInput && document.activeElement === textureInput) openTexturePicker(textureInput, true);
  }
  catch(e){}
}
loadList(); loadTextures();
</script>
</body>
</html>
